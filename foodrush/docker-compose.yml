# docker-compose.yml
version: '3.9'

networks:
  foodrush-net:
    driver: bridge

volumes:
  postgres_users_data:
  postgres_orders_data:
  postgres_restaurants_data:
  elasticsearch_data:
  kafka_data:
  zookeeper_data:

services:
  # ─── INFRASTRUCTURE ──────────────────────────────────────
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks: [foodrush-net]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper: { condition: service_healthy }
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [foodrush-net]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [foodrush-net]

  # ─── DATABASES (one per service) ─────────────────────────
  
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: ${POSTGRES_USERS_PASSWORD}
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
      - ./services/user-service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [foodrush-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc -d users_db"]
      interval: 5s
      retries: 10

  postgres-orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: order_svc
      POSTGRES_PASSWORD: ${POSTGRES_ORDERS_PASSWORD}
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    networks: [foodrush-net]

  postgres-restaurants:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurants_db
      POSTGRES_USER: restaurant_svc
      POSTGRES_PASSWORD: ${POSTGRES_RESTAURANTS_PASSWORD}
    volumes:
      - postgres_restaurants_data:/var/lib/postgresql/data
    networks: [foodrush-net]

  # ─── ELASTICSEARCH ───────────────────────────────────────
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=foodrush-cluster
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks: [foodrush-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    depends_on: [elasticsearch]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks: [foodrush-net]

  # ─── REDIS ───────────────────────────────────────────────
  
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks: [foodrush-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ─── APPLICATION SERVICES ────────────────────────────────
  
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:3001
      RESTAURANT_SERVICE_URL: http://restaurant-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      DELIVERY_SERVICE_URL: http://delivery-service:3004
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    networks: [foodrush-net]

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql://user_svc:${POSTGRES_USERS_PASSWORD}@postgres-users:5432/users_db
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-users: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [foodrush-net]

  restaurant-service:
    build: ./services/restaurant-service
    environment:
      DATABASE_URL: postgresql://restaurant_svc:${POSTGRES_RESTAURANTS_PASSWORD}@postgres-restaurants:5432/restaurants_db
      KAFKA_BROKERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres-restaurants: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    networks: [foodrush-net]

  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: postgresql://order_svc:${POSTGRES_ORDERS_PASSWORD}@postgres-orders:5432/orders_db
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres-orders: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [foodrush-net]

  delivery-service:
    build: ./services/delivery-service
    environment:
      KAFKA_BROKERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      kafka: { condition: service_healthy }
    networks: [foodrush-net]

  notification-service:
    build: ./services/notification-service
    environment:
      KAFKA_BROKERS: kafka:29092
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      kafka: { condition: service_healthy }
    networks: [foodrush-net]